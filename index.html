<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Subtracting Game - Task 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .game-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        .hidden { display: none; }
        .number-btn { width: 60px; height: 60px; margin: 8px; font-size: 1.4rem; font-weight: bold; transition: 0.3s; border-radius: 12px; }
        .number-btn:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .score-box { background: #f8f9fa; padding: 20px; border-radius: 15px; border-bottom: 4px solid #dee2e6; }
        .human-highlight { border-color: #0d6efd !important; color: #0d6efd; }
        .comp-highlight { border-color: #dc3545 !important; color: #dc3545; }
    </style>
</head>
<body>

<div class="game-container">
    <div id="menu">
        <h2 class="text-center mb-4">Game Configuration</h2>
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label">String Length (15-25):</label>
                <input type="number" id="lengthInput" class="form-control" value="15" min="15" max="25">
            </div>
            <div class="col-md-6">
                <label class="form-label">Who Starts First?</label>
                <select id="startSelect" class="form-select">
                    <option value="user">User (Abhi)</option>
                    <option value="computer">Computer (AI)</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Algorithm Choice:</label>
                <select id="algoSelect" class="form-select">
                    <option value="AlphaBeta">Alpha-Beta Pruning</option>
                    <option value="Minimax">Minimax</option>
                </select>
            </div>
            <div class="col-12 mt-4">
                <button onclick="launchGame()" class="btn btn-primary w-100 btn-lg shadow-sm">START MISSION</button>
            </div>
        </div>
    </div>

    <div id="game" class="hidden">
        <div class="d-flex justify-content-between mb-4">
            <div class="score-box flex-fill me-2 text-center human-highlight">
                <small>Abhi (User)</small>
                <h2 id="uScore">50</h2>
            </div>
            <div class="score-box flex-fill ms-2 text-center comp-highlight">
                <small>Computer (AI)</small>
                <h2 id="aiScore">50</h2>
            </div>
        </div>

        <div id="info" class="alert alert-primary text-center fw-bold">Game Started!</div>
        
        <div id="board" class="d-flex flex-wrap justify-content-center mb-4">
            </div>

        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-outline-secondary flex-fill" onclick="location.reload()">Reset Settings</button>
            <button id="newGameBtn" class="btn btn-success flex-fill hidden" onclick="location.reload()">Play Again</button>
        </div>
    </div>
</div>

<script src="index.js"></script>
<script src="aiAlgorithms.js"></script>

<script>
    let currentBoardNode = null;
    let selectedAlgo = "";

    function launchGame() {
        const len = document.getElementById('lengthInput').value;
        const starterStr = document.getElementById('startSelect').value;
        selectedAlgo = document.getElementById('algoSelect').value;

        // 1. MUSTAFA'S LOGIC: Generate array and Root Node
        let initialArray = makeNumArray(parseInt(len));
        
        // We use Mustafa's HUMAN/COMPUTER constants
        const firstPlayer = (starterStr === "user") ? HUMAN : COMPUTER;
        currentBoardNode = makeStartNode(initialArray, firstPlayer);

        // 2. UI Swap
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');

        updateDisplay();

        // If computer is first, trigger it
        if (currentBoardNode.whoseTurn === COMPUTER) {
            doAiTurn();
        }
    }

    function updateDisplay() {
        const boardDiv = document.getElementById('board');
        boardDiv.innerHTML = "";
        
        // Update Scores from Mustafa's node data
        document.getElementById('uScore').innerText = currentBoardNode.humanPts;
        document.getElementById('aiScore').innerText = currentBoardNode.compPts;

        // Draw buttons for remaining numbers
        currentBoardNode.nums.forEach((num, i) => {
            let b = document.createElement('button');
            b.className = "btn btn-outline-primary number-btn";
            b.innerText = num;
            b.onclick = () => {
                if (currentBoardNode.whoseTurn === HUMAN) {
                    currentBoardNode = applyMove(currentBoardNode, i);
                    checkGameStatus();
                }
            };
            boardDiv.appendChild(b);
        });
    }

    function checkGameStatus() {
        updateDisplay();
        
        if (currentBoardNode.terminal) {
            let result = getWinner(currentBoardNode);
            let message = "Game Over! ";
            if(result === HUMAN) message += "Abhi Wins!";
            else if(result === COMPUTER) message += "AI Wins!";
            else message += "It's a Draw!";
            
            document.getElementById('info').className = "alert alert-success text-center fw-bold";
            document.getElementById('info').innerText = message;
            document.getElementById('newGameBtn').classList.remove('hidden');
        } else if (currentBoardNode.whoseTurn === COMPUTER) {
            doAiTurn();
        }
    }

    function doAiTurn() {
        document.getElementById('info').innerText = "AI is thinking...";
        
        // Timeout gives the UI a chance to update so it doesn't look frozen
        setTimeout(() => {
            // Calling aiAlgorithms.js logic
            let moveResult = getBestComputerMove(currentBoardNode, selectedAlgo, 5);
            
            // Apply the move Mustafa's way
            let idx = currentBoardNode.nums.indexOf(moveResult.removedNum);
            currentBoardNode = applyMove(currentBoardNode, idx);
            
            document.getElementById('info').innerText = "Your Turn";
            checkGameStatus();
        }, 600);
    }
</script>
</body>
</html>
